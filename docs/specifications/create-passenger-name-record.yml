                bookGDSviaCSL:
                  description: |
                    Used to indicate whether GDS hotel should be booked using new booking path (CSL) or the legacy path (low level services).

                    If `true`, the hotel originally sourced from the GDS will be booked using the Content Services for Lodging (CSL) booking path.

                    If `false`, the hotel booking will follow Content Services for Lodging (CSL) path for a PCC (or EPR) that has already been migrated to the CSL segment flow.
                    
                    Also, it will follow Content Services for Lodging (CSL) booking path for all requests starting from March 26, 2024.
                  default: true
                  type: boolean
                  example: true
                legacyIURforCSL:
                  description: |
                    Used to request a legacy accounting record (IUR structure `HHL`) for a Content Services for Lodging (CSL) booking path.
                    
                    If `true`, requests a legacy accounting record.
                    
                    If `false`, or the attribute is not present, a new CSL accounting record will be generated (IUR structure `HHX`).
                  type: boolean
                  example: false

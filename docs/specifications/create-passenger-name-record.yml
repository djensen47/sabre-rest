                                description: Used to specify a passenger name number.
                                type: string
                                example: '1.1'
                              Phone:
                                description: Used to add customer telephone numbers into the record.
                                type: string
                                example: '817-555-1212'
                              PhoneUseType:
                                description: Used to specify if the number is agency `A`, home `H`, business `B` or fax `F`.
                                type: string
                                example: 'H'
                            required:
                              - Phone
                              - PhoneUseType
                          minItems: 1
                      required:
                        - ContactNumber
                    Corporate:
                      type: object
                      description: |
                        Used to specify that the type of the journey is corporate, i.e. through a corporation.

                        It cannot be combined with any other qualifier.

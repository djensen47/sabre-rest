                              temporaryId:
                                description: |
                                  
                                  Used to provide an FOP association identifier. 
                                  
                                    The value must match `.../SpecialReqDetails/AddRemarkRQ/RemarkInfo/FOP_Remark_Association/Association_Info/Child/@temporaryId` and is only used when a FOP remark is added together with its association during a single API call.

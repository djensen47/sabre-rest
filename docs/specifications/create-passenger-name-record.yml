    ApplicationResults:
      type: object
      description: Contains general request processing outcomes, including the transaction `status`. The service may also return `Success`, `Error`, and `Warning` arrays.
      required:
        - status
      properties:
        Success:
          description: Lists details of a successful call.
          type: array
          maxItems: 99
          items:
            $ref: "#/components/schemas/ProblemInformation"
        Error:
          description: Lists details of any errors encountered during processing.
          type: array
          maxItems: 99
          items:
            $ref: "#/components/schemas/ProblemInformation"
        Warning:
          description: Lists details of any issues encountered during processing. Use this information to troubleshoot.
          type: array
          maxItems: 99
          items:
            $ref: "#/components/schemas/ProblemInformation"
        status:
          type: string
          enum:
            - Complete
            - Incomplete
            - NotProcessed
            - Unknown
          description: Identifies the transaction status.
          example: 'Complete'

    ProblemInformation:
      type: object
      description: Contains complete request processing details retrieved from the system.
      properties:
        SystemSpecificResults:
          description: Lists specific information from the system and/or other sub-systems invoked during processing.
          type: array
          maxItems: 99
          items:
            type: object
            description: Contains a set of request processing results.
            properties:
              HostCommand:
                type: object
                description: Contains the executed Sabre host system command.
                properties:
                  LNIATA:
                    type: string
                    description: An abbreviation for Line (LN), Interchange Address (IA), and Terminal Address (TA). A three-byte terminal address, usually provided as a six-character hexadecimal value.
                    example: 0358DC
                  content:
                    maxLength: 4096
                    type: string
                    description: Sabre host system command.
                    example: '120MAYDFWLAX'
              Message:
                items:
                  properties:
                    code:
                      type: string
                      description: An abbreviated version of the error or warning code in textual format.
                      example: WARN.SP.PROVIDER_WARNING
                    content:
                      maxLength: 4096
                      type: string
                      description: An indication of the source of error or warning when processing the request.
                      example: PNR has not been updated successfully, see remaining messages for details.
                maxItems: 99
                type: array
                description: Lists messages returned by the system.
              ShortText:
                maxLength: 128
                minLength: 1
                type: string
                description: An abbreviated version of the error or warning in textual format.
                example: ADDITIONAL ALLOWANCES AND/OR DISCOUNTS MAY APPL
              Element:
                maxLength: 4096
                type: string
                description: |
                  If present, this attribute may identify an unknown or misspelled tag that caused an error in processing.

                  It is recommended that the Tag attribute use XPath notation to identify the location of a tag in the event that more than one tag of the same name is present in the document.

                  Alternatively, the tag name alone can be used to identify missing data [Type=ReqFieldMissing].
                example: 'Unknown Element'
              RecordID:
                maxLength: 255
                minLength: 1
                type: string
                description: If returned, allows for batch processing and the identification of the record that failed amongst a group of records. May be a concatenation of the ID of the failed transaction with specific record(s) associated to that transaction.
                example: Unknown RecordID
              DocURL:
                format: uri
                type: string
                description: The address for online documentation of the error.
                example: https://developer.sabre.com
              timeStamp:
                type: string
                format: iso8601-date-time
                description: Transaction timestamp in ISO 8601 format.
                example: '2024-02-13T04:16:10.174-06:00'
              reference:
                type: string
                description: If returned, provides an XML ID reference to the element for which the results apply.
                example: XML IDREF
        type:
          type: string
          enum:
            - Transport
            - Validation
            - Application
            - BusinessLogic
          description: Indicates the source of error or warning.
          example: BusinessLogic
        timeStamp:
          type: string
          format: iso8601-date-time
          description: Transaction timestamp in ISO 8601 format.
          example: '2024-02-13T04:16:10.174-06:00'


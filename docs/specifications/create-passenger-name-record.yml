        To associate a new form of payment with a particular use type or/and trip type, you must provide the same `temporaryId` that maps the new FOP to those two types under both `FOP_Remark` and `FOP_Remark_Association`.
        
        Each form of payment may be associated to a different use type or/and trip type.
        You can send multiple `FOP_Remark_Association` items to associate both use and trip type to a specific form of payment.
        
        > **Note**: One `Child` item can contain one use type or one trip type. To associate a use and a trip type (`Child`) to an existing form of payment (`Parent`), pass both a `Parent` (with a preexisting FOP index in `referenceType`) and a `Child` (with use and trip types) within two separate FOP_Remark_Association object as indicated in the example.
        

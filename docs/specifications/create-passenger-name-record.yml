                                    T3DSAuthValue:
                                      description: |
                                        The 3DS Authentication value beginning with one of the following cryptograms:
                                        
                                        - `AAV` for Mastercard
                                        
                                        - `AEVV` for Amex
                                        
                                        - `CAVV` for Visa.
                                        
                                        A 20-byte value that has been Base64 encoded, resulting in a 28-byte string.
                                      example: ABC123455533533444455555678
                                      type: string
                                    TAVV:
                                      description: |
                                        The token authentication value.
                                        
                                        A 20-byte value that has been Base64 encoded, resulting in a 28-byte string.
                                      example: ABC3434334343556677487312567
                                      type: string
                                    ECI:
                                      description: The Electronic Commerce Indicator consisting of two alphanumeric characters.
                                      example: AB
                                      type: string
                                    DirectoryServerTrxID:
                                      description: The 3DS transaction ID returned by the 3DS Directory Server. A 20-byte, unsigned binary value.
                                      example: ABCDEFGHI123456789012!.1234567890123

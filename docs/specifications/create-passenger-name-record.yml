                          type: string
                        QueueNumber:
                          example: 55
                          description: The queue number.
                          type: integer
                        QueueName:
                          example: 'FB'
                          description: The queue name.
                          type: string
                        ShortText:
                          example: 'TEST'
                          description: The miscellaneous free text.
                          type: string
                        TicketTimeLimit:
                          example: '12-21T08:00'
                          description: |
                            Used to specify the ticket time limit.

                            `TicketTimeLimit` is shown in the following format - MM-DDTHH:00.

                            `TicketTimeLimit` must be at the top of the hour.

                            This is a date time type that forces both the date and the time to be specified.

                            The year and seconds can be omitted.

                            Example formats - `yyyy-mm-ddThh:mm:ss`, `mm-ddThh:mm:ss`, `mm-ddThh:mm`, `yyyy-mm-ddThh:mm`.
                          type: string
                          pattern: '(((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-9])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-30)))|(((19|20)(([02468][048])|([13579][26]))-02-29))|((20[0-9][0-9])|(19[0-9][0-9]))-((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-8])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-(29|30)))))T([0-1][0-9]|[2][0-3])(:([0-5][0-9])){1,2}'
                        TicketType:
                          example: '7TAW'
                          description: |
                            Used to pass the ticketing type.

                            Acceptable values are: `7TAW`, `7TAX`, `7T-A`, `8(time)`, or `8(time/(date)`.
                          type: string
                      required:
                        - TicketType
                CustomerInfo:
                  type: object
                  description: Used to pass passenger`s details.
                  properties:
                    ContactNumbers:
                      type: object

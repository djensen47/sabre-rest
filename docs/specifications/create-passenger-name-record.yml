                          type: string
                          example: 'AA'
                      required:
                        - Code
                  required:
                    - Airline
                DepartureDateTime:
                  description: Used to specify the date and time associated with the miscellaneous segment.
                  type: string
                  example: '12-21'
                  pattern: '(((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-9])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-30)))|(((19|20)(([02468][048])|([13579][26]))-02-29))|((20[0-9][0-9])|(19[0-9][0-9]))-((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-8])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-(29|30)))))'
                InsertAfter:

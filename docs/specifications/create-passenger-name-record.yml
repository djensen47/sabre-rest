                                description: The personal details.
                                properties:
                                  GivenName:
                                    description: The person`s first name. The maximum number of characters accepted by Sabre is 29.
                                    example: 'SWS'
                                    type: string
                                  Surname:
                                    description: The person`s last name. The maximum number of characters accepted by Sabre is 29.
                                    example: 'Surname'
                                    type: string
                                  DateOfBirth:
                                    description: |
                                      The date of birth.

                                      `DateOfBirth` accepts dates in the following formats - `YYYY-MM-DD` and `YY-MM-DD`.

                                      `DateOfBirth` and `Gender` cannot be combined with `../RedressNumber` and `../KnownTravelerNumber`.
                                    example: '1980-01-01'
                                    type: string
                                  Gender:
                                    description: |
                                      The gender type code.
                                      `F` denotes FEMALE
                                      `M` denotes MALE
                                      `FI` denotes INFANT FEMALE
                                      `MI` denotes INFANT_MALE
                                      `U` denotes UNDISCLOSED
                                      `X` denotes UNDEFINED
                                      `UI` denotes UNDISCLOSED INFANT
                                      `XI` denotes UNDEFINED INFANT
                                    type: string
                                    enum:
                                      - F
                                      - M
                                      - FI
                                      - MI
                                      - U
                                      - X
                                      - UI
                                      - XI
                                  NameNumber:
                                    description: |
                                      The name number.

                                      Example: 1.1, 2.1. etc.
                                    example: '1.1'
                                    type: string
                                  LapChild:
                                    description: |
                                      If `true`, the passenger is a lap child.
                                      
                                      This can only be used together with `SpecialServiceInfo.AdvancePassenger.Document.Visa` and `SpecialServiceInfo.AdvancePassenger.ResidentDestinationAddress`.
                                    type: boolean
                                    example: true
                              RedressNumber:
                                description: |
                                  The redress number.

                                  `RedressNumber` cannot be combined with `PersonName.DateOfBirth` or `PersonName.Gender`.
                                example: '123456789'
                                type: string
                              VendorPrefs:
                                type: object
                                description: Contains airline vendor preferences.
                                properties:
                                  Airline:
                                    type: object
                                    description: Contains airline vendor preference information.
                                    properties:
                                      Hosted:
                                        description: If `true`, the receiving airline is a Sabre-hosted carrier.
                                        type: boolean
                                        example: true
                                required:
                                  - Airline
                              SegmentNumber:
                                description: |
                                  The segment number.

                                  Used to specify an itinerary segment to associate the SSR to.

                                  `A` can be specified to associate the SSR to all segments.
                                example: '2'
                                type: string
                          minItems: 0
                        Service:
                          description: Used to specify Special Service Request (SSR).
                          type: array
                          items:
                            properties:
                              PersonName:
                                type: object
                                description: The personal details.
                                properties:
                                  NameNumber:
                                    description: Used to specify a passenger name number.
                                    example: "3.1"
                                    type: string
                              Text:
                                description: Used to specify miscellaneous free text information.
                                example: "Any info"
                                type: string
                              VendorPrefs:
                                type: object
                                description: Contains airline vendor preferences.
                                properties:
                                  Airline:
                                    type: object
                                    description: Contains airline vendor preference information.
                                    properties:
                                      Code:
                                        description: |
                                          The airline code.

                                          Applicable to the `OSI` SSRCode, and is used to specify the airline that the SSR needs to be sent to.
                                        example: 'YY'
                                        type: string
                                      Hosted:
                                        description: If `true`, the receiving airline is a Sabre-hosted carrier.
                                        type: boolean
                                        example: true
                                required:
                                  - Airline
                              SegmentNumber:
                                description: |
                                  The segment number.

                                  Used to specify an itinerary segment to associate the SSR to.

                                  If `SSR_Code`=`OSI` `SegmentNumber` cannot be utilized.
                                example: '2'
                                type: string
                              SSR_Code:
                                description: |
                                  The SSR code.

                                  Used to specify an SSR code such as `WCHR`, `WGML`, etc.
                                example: 'WCHR'
                                type: string
                            required:
                              - SSR_Code
                          minItems: 0
                  required:
                    - SpecialServiceInfo
            PostProcessing:
              type: object
              description: Additional variables used to finalize the PNR creation.
              properties:
                ARUNK:
                  type: object
                  description: |
                    Used to add arrival unknown segments into a passenger name record.

                    The system will properly apply them so there is no need to segment select, etc.
                  properties:
                    keepSegments:
                      description: |
                        Used to force the system to maintain accurate segment numbers when pricing with segment selection.

                        When the user adds ARUNK to already booked itinerary, the segment numbering may change.

                        In such a case keepSegments=`true` takes into account the potential segment changes and sends correct data to pricing.
                      type: boolean
                      default: false
                      example: true
                    priorPricing:
                      description: Used to add arrival unknown segments into a passenger name record after air segment sell but prior to pricing.
                      type: boolean
                      example: true
                QueuePlace:
                  type: object
                  description: Used to request to place the newly created PNR on a queue.
                  properties:
                    MultiQueuePlace:
                      type: object
                      description: Used to request to place the newly created PNR on multiple queues.
                      properties:
                        QueueIdentifier:
                          description: A single queue details.
                          type: array
                          items:
                            properties:
                              Number:
                                description: The queue number.
                                type: string
                                example: '499'
                              PrefatoryInstructionCode:
                                description: The prefatory instruction code.
                                type: string
                                example: '11'
                              PseudoCityCode:
                                description: The pseudo city code.
                                type: string
                                example: 'IPCC1'
                            required:
                              - Number
                              - PrefatoryInstructionCode
                              - PseudoCityCode
                          minItems: 1
                          maxItems: 20
                      required:
                        - QueueIdentifier
                    QueueInfo:
                      type: object
                      description: Used to request to place the newly created PNR on a queue.
                      properties:
                        QueueIdentifier:
                          description: The single queue details.
                          type: array
                          items:
                            properties:
                              Name:
                                description: The queue name.
                                type: string
                                example: 'ABC213'
                              Number:
                                description: The queue number.
                                type: string
                                example: '400'
                              PrefatoryInstructionCode:
                                description: The prefatory instruction code.
                                type: string
                                example: '11'
                              PseudoCityCode:
                                description: The pseudo city code.
                                type: string
                                example: 'IPCC1'
                          minItems: 1
                          maxItems: 10
                        UniqueID:
                          description: This element is not used by this API.
                          type: array
                          items:
                            properties:
                              ID:
                                description: This element is not used by this API.
                                example: 'test'
                                type: string
                            required:
                              - ID
                          minItems: 0
                          maxItems: 6
                      required:
                        - QueueIdentifier
                EndTransaction:
                  type: object
                  description: Used to finalize the transaction and commit the passenger name record.
                  properties:
                    Source:
                      type: object
                      description: Used to identify the entity that authorized the changes in a passenger name record.
                      properties:
                        ReceivedFrom:
                          description: The source name.
                          example: 'SWS TESTING'
                          type: string
                          minLength: 1
                          maxLength: 128
                      required:
                        - ReceivedFrom
                    ScheduleChange:
                      description: Used to update the schedule changes and commit them to the PNR.
                      properties:
                        Ind:
                          description: If `true`, information about schedule changes will be written to the PNR.
                          example: false
                          type: boolean
                      required:
                        - Ind
                      type: object
                    Email:
                      type: object
                      description: Used to request e-mail notifications after ending the passenger name record.
                      properties:
                        eTicket:
                          type: object
                          description: Related e-mail request information.
                          properties:
                            PDF:
                              type: object
                              description: Used to send an email notification containing a PDF-based copy of the eTicket.
                              properties:
                                Ind:
                                  description: Used to indicate whether to send an email notification containing a PDF-based copy of the electronic ticket.
                                  type: boolean
                                  example: true
                              required:
                                - Ind
                            Ind:
                              description: Used to indicate whether to send an email notification containing a text-based copy of the electronic ticket.
                              type: boolean
                              example: true
                          required:
                            - Ind
                        Invoice:
                          type: object
                          description: |
                            Used to send an email notification containing a text-based copy of the invoice.

                            `Invoice` cannot be combined with `eTicket`, or `Itinerary`.
                          properties:
                            Ind:
                              description: Specifies whether an reservation invoice should be sent via e-mail.
                              type: boolean
                              example: true
                          required:
                            - Ind
                        Itinerary:
                          type: object
                          description: |
                            Used to send an email notification containing a text-based copy of the itinerary.

                            The itinerary cannot be combined with `eTicket`, or `Invoice`.
                          properties:
                            PDF:
                              type: object
                              description: Used to send an email notification containing a PDF-based copy of the itinerary.
                              properties:
                                Ind:
                                  description: Used to indicate whether to send an email notification containing a PDF-based copy of the itinerary.
                                  type: boolean
                                  example: true
                              required:
                                - Ind
                            Segment:
                              type: array
                              items:
                                properties:
                                  EndNumber:
                                    description: Used to specify an ending segment in the range within the range that is to be included in the email message.
                                    example: 3
                                    type: integer
                                  Number:
                                    type: integer
                                    description: Used to specify a segment number.
                                    example: 1
                                required:
                                  - Number
                              minItems: 0
                            Ind:
                              description: Used to indicate whether to send an e-mail notification containing a text-based copy of the itinerary.
                              type: boolean
                              example: true
                          required:
                            - Ind
                        PersonName:
                          type: object
                          description: |
                            Used to specify a particular passenger name number to send the email notification to.

                            Please note that the email address in the PNR`s email field must be the name associated with the specified name number.
                          properties:
                            NameNumber:
                              description: The name number.
                              example: '2.1'
                              type: string
                          required:
                            - NameNumber
                        Ind:
                          description: Used to send an email notification upon end transaction to any email addresses contained within the particular record.
                          type: boolean
                          example: true
                      required:
                        - Ind
                  required:
                    - Source
                PostBookingHKValidation:
                  type: object
                  description: |
                    Used to validate whether after the booking is ended, codeshare flights keep the holding confirmed status or not.

                    If the `HK` status changes for any of the flight segments, the service will send a warning message.

                    `PostBookingHKValidation` must be combined with `PostProcessing.RedisplayReservation`=`true`.
                  properties:
                    waitInterval:
                      description: |
                        The duration of the wait interval.

                        The maximum time that can be set is 60 seconds.

                        This applies to PostBookingHKValidation, WaitForAirlineRecLoc or both.
                      example: 1000
                      type: integer
                      maximum: 10000
                      minimum: 100
                    numAttempts:
                      description: |
                        The number of attempts that the reservation will be re-displayed.

                        If both `PostBookingHKValidation` and `WaitForAirlineRecLoc` have defined `waitInterval` then the highest number will be used for both.
                      example: 2
                      type: integer
                      maximum: 6
                      minimum: 1
                  required:
                    - waitInterval
                    - numAttempts
                WaitForAirlineRecLoc:
                  type: object
                  description: |
                    Used to check, whether the airline record locators have been returned by Air segment providers.

                    If one or more locators are not returned after the specified interval and number of attempts, the service will send a warning message.

                    `WaitForAirlineRecLoc` must be combined with `PostProcessing.RedisplayReservation`=`true`.
                  properties:
                    waitInterval:
                      description: |
                        The duration of the wait interval.

                        The maximum time that can be set is 60 seconds.

                        This applies to PostBookingHKValidation, WaitForAirlineRecLoc or both.
                      example: 1000
                      type: integer
                      maximum: 10000
                      minimum: 100
                    numAttempts:
                      description: |
                        The number of attempts that the reservation will be re-displayed.

                        If both `PostBookingHKValidation` and `WaitForAirlineRecLoc` have defined `waitInterval` then the highest number will be used for both.
                      example: 2
                      type: integer
                      maximum: 6
                      minimum: 1
                  required:
                    - waitInterval
                    - numAttempts
                RedisplayReservation:
                  type: object
                  description: Used to indicate whether or not to re-display the PNR.
                  properties:
                    waitInterval:
                      description: Used to specify an interval that the system should wait in milliseconds before making redisplay service calls.
                      example: 1000
                      type: integer
                      maximum: 10000
                      minimum: 100
                    returnExtendedPriceQuote:
                      description: |
                        Used to request extended price quote display in the service response.

                        The extended content will be passed at .../TravelItineraryRead/PriceQuote.
                      type: boolean
                      example: true
                unmaskCreditCard:
                  description: |
                    Used to unmask credit card information in the TIR response.

                    Please note that this attribute has an effect only if the user has the EPR keyword CCVIEW.
                  type: boolean
                  example: true
                PricingInterval:
                  type: object
                  description: |
                    Wait interval before second and subsequent pricing operations.

                    For example, if you send four `PriceRequestInformation` nodes, the system will perform four pricing operations.

                    In this case, the delay is set after the first, second, and third operations.
                  properties:
                    waitInterval:
                      description: |
                        Specifies an interval that the system should wait in milliseconds between pricing operations.

                        Note that the API does not execute the delay logic when this object is not sent.
                      example: 100
                      type: integer
                      maximum: 500
                      minimum: 100
            SPInternal:
              description: Used for internal processing.
              type: object
              additionalProperties: true
            targetCity:
              description: |
                Used to specify whether or not the API should change context to a desired pseudo city code.

                If `targetCity` is empty or equals current city the API does not change the context.
              example: 'AAA'
              type: string
              minLength: 3
              maxLength: 4
            haltOnInvalidMCT:
              description: Used to specify whether the service should check and stop processing upon encountering an error indicating that minimum connection time between air itinerary segments is not met.
              example: true
              type: boolean
            haltOnAirPriceError:
              description: Used to specify whether the service should stop processing upon encountering an error during air booking and pricing.
              type: boolean
              example: true
            haltOnHotelBookError:
              description: |
                If `true`, stops processing when a hotel booking error is encountered.

                Applies to both single `HotelBook` and multiple hotel bookings `HotelBookings`.
              type: boolean
              example: true
            haltOnVehicleBookError:
              description: Used to specify whether the service should stop processing upon encountering a vehicle book error.
              type: boolean
              example: true
            haltWhenNoHotelCF:
              description: Used to specify whether the service should stop processing when a hotel reservation does not return a confirmation number, before the transaction is committed.
              type: boolean
              example: false
            healthCheck:
              description: |
                This is for Sabre internal use only.

                If `true`, the API is queried in health check mode and will return a blank success that does not invoke downstream providers.
              type: boolean
              example: false
            version:
              type: string
              example: '2.5.0'
              description: The API version.
              minLength: 1
              maxLength: 255
          required:
            - PostProcessing
      required:
        - CreatePassengerNameRecordRQ


                                      type: integer
                                    tripType:
                                      description: Identifies the trip type associated to a form of payment. Can be `AZ` (All), `CP` (Corporate/Business), `LS` (Leisure), `EM` (Emergency), `FM` (Family), or `GP` (Group).
                                      example: 'AZ'
                                      type: string
                                      enum:
                                        - AZ
                                        - CP
                                        - LS
                                        - EM
                                        - FM
                                        - GP
                                    useType:
                                      description: Identifies the use type associated to a form of payment. Can be `AZ` (All), `AN` (Ancillary), `AL` (Airline), `BU` (Bus/Ground Transportation), `CR` (Car), `CS` (Cruise), `HL` (Hotel), `IN` (Insurance), `LC` (Low-Cost Carrier), `OT` (Other), `RL` (Rail), `SS` (Specialty Service), `TR` (Tour), or `IR` (Interface Record).
                                      example: 'AZ'
                                      type: string
                                      enum:
                                        - AZ
                                        - AN
                                        - AL
                                        - BU
                                        - CR
                                        - CS
                                        - HL
                                        - IN
                                        - LC
                                        - OT
                                        - RL
                                        - SS
                                        - TR
                                        - IR
                                minItems: 0

                    CreditCardData:
                      type: object
                      description: |
                        Used to pass the credit card billing information.

                        Please note that .../BillingInformation and .../PreferredCustomer are mutually exclusive.
                      properties:
                        BillingInformation:
                          type: object
                          description: Used to pass the credit card billing information.
                          properties:

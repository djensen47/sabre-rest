                                          properties:
                                            HiddenStop:
                                              description: Used to pass the hidden city / via code.
                                              type: array
                                              items:
                                                properties:
                                                  LocationCode:
                                                    description: The airport code.
                                                    type: string
                                                    example: 'MEX'
                                                required:
                                                  - LocationCode
                                              minItems: 1
                                          required:
                                            - HiddenStop
                                        MarketingAirline:
                                          type: object
                                          description: The marketing airline code.
                                          properties:
                                            Code:
                                              description: Used to describe the Marketing Carrier Code of the airline.
                                              type: string
                                              example: 'AM'
                                          required:
                                            - Code
                                        OperatingAirline:
                                          type: object
                                          description: The operating airline code.
                                          properties:
                                            Code:
                                              description: The carrier code.
                                              type: string
                                              example: 'MEX'
                                          required:
                                            - Code
                                        DepartureDateTime:
                                          description: |
                                            `DepartureDateTime` is used to describe the date and time of the traveler`s departure.

                                            It is shown in the `YYYY-MM-DDThh:mm:ss` format.
                                          type: string
                                          example: '2024-11-22T12:40:00'
                                          pattern: '[2][0-9]{3}-[0-1][0-9]-[0-3][0-9][T][0-9]{2}:[0-9]{2}:[0-9]{2}'
                                        ArrivalDateTime:
                                          description: |
                                            `ArrivalDateTime` is used to describe the date and time of the traveler`s arrival.

                                            It is shown in the `YYYY-MM-DDThh:mm:ss` format.
                                          type: string
                                          example: '2024-11-22T12:40:00'
                                          pattern: '[2][0-9]{3}-[0-1][0-9]-[0-3][0-9][T][0-9]{2}:[0-9]{2}:[0-9]{2}'
                                        FlightNumber:
                                          description: The marketing flight number.
                                          type: integer
                                          example: 665
                                        ResBookDesigCode:
                                          description: The booking code.
                                          type: string
                                          example: 'Y'
                                        ForceConnectionInd:
                                          description: Used to indicate whether the Flight segment is a forced connection.
                                          type: boolean
                                          example: true
                                        ForceStopOverInd:
                                          description: Used to indicate whether the Flight segment is a forced stop over.
                                          type: boolean
                                          example: true
                                      required:
                                        - ArrivalAirport
                                        - DepartureAirport
                                        - Equipment
                                        - MarketingAirline
                                        - DepartureDateTime
                                        - ArrivalDateTime
                                        - FlightNumber
                                        - ResBookDesigCode
                                    minItems: 1
                                  RPH:
                                    description: |
                                      Used to pass Sequence Number of the itineraries.

                                      For example, 1 for itinerary #1 and 2 or itinerary #2.
                                    type: integer
                                    example: 1
                                  TicketingCarrier:
                                    description: Used to pass the Ticketing Carrier.
                                    type: string
                                    example: 'AM'
                                  ValidatingCarrier:
                                    description: Used to pass the Validating Carrier.
                                    type: string
                                    example: 'AM'

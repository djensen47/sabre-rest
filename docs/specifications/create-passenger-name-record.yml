                - VendorPrefs
                - DepartureDateTime
                - NumberInParty
                - Status
                - Type
            SpecialReqDetails:
              type: object
              description: Used to add additional special requests such as seats, remarks, SSRs.
              properties:
                AddRemark:
                  type: object
                  description: Used to add remarks.
                  properties:
                    RemarkInfo:
                      type: object
                      description: The remark information.
                      properties:
                        FOP_Remark:
                          description: Lists form of payment remarks to add.
                          type: array
                          items:
                            description: Contains a form of payment remark.
                            type: object
                            properties:
                              CC_Info:
                                description: Contains credit card information for the remark.
                                type: object
                                properties:
                                  PaymentCard:
                                    description: Contains payment card details.
                                    type: object
                                    properties:
                                      AirlineCode:
                                        description: The airline code to use in conjunction with `CardSecurityCode`.
                                        example: 'YY'
                                        type: string
                                      CardSecurityCode:
                                        description: Used to specify a credit card security code.
                                        example: '1234'
                                        type: string
                                      Code:
                                        description: Used to specify a credit card vendor code.
                                        example: VI
                                        type: string
                                      ExpireDate:
                                        description: The credit card expiration date in `YYYY-MM` format. More information is available [on this page](https://www.w3.org/TR/xmlschema-2/#gYearMonth).
                                        example: '2020-12'
                                        type: string
                                        pattern: '\d{4}-\d{2}'
                                      ExtendedPayment:
                                        description: The number of months by which to extend the payment.
                                        example: '12'
                                        type: string
                                      ManualApprovalCode:
                                        description: The manual credit card approval code, if applicable.
                                        example: '123456'
                                        type: string
                                      Number:
                                        description: The credit card number.
                                        example: '4123412341234123'
                                        type: string
                                      SuppressApprovalCode:
                                        description: If `true`, prevents the Sabre system from generating an approval code when the credit card number is entered into the system.
                                        example: true
                                        type: boolean
                                      GenerateApprovalAtTicketing:
                                        description: If `true`, generates a ticketing approval code upon the addition of new form of payment data.
                                        example: true
                                        default: false
                                        type: boolean
                                    required:
                                      - Code
                                      - ExpireDate
                                      - Number
                                  CardHolderName:
                                    description: Contains the payment cardholder name.
                                    type: object
                                    properties:
                                      GivenName:
                                        description: Contains the credit card holder given name.
                                        example: 'John'
                                        type: string
                                      Surname:
                                        description: Specifies the credit card holder surname.
                                        example: 'Smith'
                                        type: string
                                  InterfaceUserRecord:
                                    description: |
                                      Contains optional information regarding a payment card destined for a back-office system.
                                      Can only be used when the payment card is associated to the Interface Record Use Type 
                                      `.../SpecialReqDetails/AddRemarkRQ/RemarkInfo/FOP_Remark_Association/Child/@useType="IR"`.
                                    type: object

# https://developer.sabre.com/docs/rest_apis/air/book/create_passenger_name_record/
---
openapi: 3.0.0
info:
  title: Create Passenger Name Record
  version: 2.5.0
  description: |
    The Create Passenger Name Record API is an orchestrated API that bundles several functions and operations into a single API call.

    This API specifically provides the capability to create a Passenger Name Record (PNR), including air segments, in a single call.
paths:
  /v2.5.0/passenger/records:
    post:
      tags:
        - Orchestrated Create Passenger Name Record
      operationId: createPassengerNameRecord
      description: Create Passenger Name Record API.
      parameters:
        - name: mode
          in: query
          required: true
          description: |
            Used to specify which operation will be performed on the passenger name record.

            Use `create` to create a PNR.
          example: 'create'
          schema:
            type: string
            enum:
              - create
      requestBody:
        content:
          application/json: # Media type
            schema: # Request body contents
              $ref: '#/components/schemas/CreatePassengerNameRecordRequest'   # Reference to an object
            examples:
              1.1. Book a round trip flight:
                $ref: '#/components/examples/roundTripExample'
              1.2 Book a hotel:
                $ref: '#/components/examples/hotelExample'
              1.3 Book a vehicle:
                $ref: '#/components/examples/vehicleExample'
              1.4 Book a miscellaneous segment:
                $ref: '#/components/examples/miscSegmentExample'
              1.5 Add a form of payment and associate it with a trip and use type:
                $ref: '#/components/examples/tripTypeUseTypeExample'
              1.6 Full request:
                $ref: '#/components/examples/requestExample'
      responses:
        "200":
          description: Response success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePassengerNameRecordResponse"
              examples:
                1. Full response:
                  $ref: '#/components/examples/responseExample'
        "400":
          description: |
            Bad Request

            - The request was not valid.
security:
  - oauth2_authentication: [ ]
tags:
  - name: Orchestrated Create Passenger Name Record
    description: Create a full reservation for air, hotel, and rental car content, all within a single request.

servers:
  - url: https://api.cert.platform.sabre.com
components:
  securitySchemes:
    oauth2_authentication:
      type: oauth2
      x-base64-encode-client-credentials: true
      flows:
        clientCredentials:
          tokenUrl: https://api.cert.platform.sabre.com/v2/auth/token
          scopes: {}
  schemas:
    CreatePassengerNameRecordRequest:
      type: object

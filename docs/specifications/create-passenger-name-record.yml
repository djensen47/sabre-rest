                                              GuaranteePrepaid:
                                                type: object
                                                description: |
                                                  Contains rates that provide detailed information of refundable amounts during payment at the time of booking.

                                                  `GuaranteePrepaid` is used when requesting a relatively new type of rate from vehicle rental vendors.

                                                  These rates provide detailed information of refundable amounts during payment at the time of booking.
                                                properties:
                                                  CancellationRefundAmount:
                                                    description: Lists the monetary amount or percentage amount of the cancellation amount, as there is no longer a refund listed.
                                                    type: array
                                                    items:
                                                      properties:
                                                        content:
                                                          description: |
                                                            The cancellation refund amount or percentage.

                                                            The refund is the difference between the guarantee prepaid amount and the `Amount` if `GuaranteePrepaid.Ind` is set to `G`.

                                                            The refund is the the remaining percentage if `GuaranteePrepaid.Ind` is set to `P`.
                                                          type: string
                                                          example: '100.00'
                                                        NumDays:
                                                          description: Number of days associated with the particular cancellation refund amount or percentage.
                                                          example: '1'
                                                          type: string
                                                    minItems: 0
                                                    maxItems: 4
                                                  Amount:
                                                    description: |
                                                      The total amount guaranteed to be charged at time of pickup, even if the customer fails to arrive.

                                                      This can also be the total amount to be prepaid at the time of booking.
                                                    example: '100.00'
                                                    type: string
                                                  AmountPercentage:
                                                    description: |
                                                      Indicates whether the `CancellationRefundAmount` is an amount or a percentage.

                                                      Can be `M` for money, or `P` for percentage.
                                                    example: 'M'
                                                    type: string
                                                  CurrencyCode:
                                                    description: The 3 letter ISO 4217 currency code of the guarantee amount.
                                                    example: 'USD'
                                                    type: string
                                                  Ind:
                                                    description: Indicator denoting whether the value is `G` for guaranteed, or `P` for prepaid.
                                                    example: 'G'
                                                    type: string

                          maxItems: 10
                        FOP_Remark_Association:
                          description: Allows to associate newly added forms of payment (by means of `.../SpecialReqDetails/AddRemarkRQ/RemarkInfo/FOP_Remark`) or existing FOPs and their associated use type(s).

            HotelBook:
              type: object
              description: |
                Used to book GDS or Aggregator chain hotels.

                Please note that for the successful PNR creation `TravelItineraryAddInfo.AgencyInfo.Address` and `TravelItineraryAddInfo.CustomerInfo.PersonName` need to be provided.
              properties:
                BookingInfo:
                  type: object
                  description: Contains the booking key and optional discount codes required for hotel booking.
                  properties:
                    BookingKey:
                      description: |
                        The Booking Key is returned in the Hotel Price Check API response and is a mandatory value to perform hotel booking.

                        BookingKey cannot be empty and must not exceed 240 characters.
                      type: string
                      minLength: 1
                      example: 'd9e73f0d-5f90-4b43-9c86-2d88a732604f'
                    CorpDiscount:
                      description: |
                        The discount code provided by a company for negotiated rates.

                        Applies to GDS hotels only.
                      type: string
                      minLength: 1
                      example: '1234567'
                    RequestorID:
                      type: string
                      description: An optional field which is no longer used (has no impact on the service behavior) and will be removed in future versions.
                      example: 'SG000000'
                  required:
                    - BookingKey
                Rooms:
                  type: object
                  description: Contains hotel room information.
                  properties:
                    Room:
                      description: Lists individual room booking details including guests, preferences, and extras.
                      type: array
                      items:
                        description: Contains details of a single room.
                        properties:
                          Guests:
                            type: object
                            description: Contains guest information for a single room booking, including contact details and preferences.
                            properties:
                              Guest:
                                description: Lists individual guest details, including contact information, loyalty programs, and special designations.
                                type: array
                                items:
                                  description: The details of a single guest staying in the room.
                                  properties:
                                    Contact:
                                      type: object
                                      description: Contains guest contact information, including phone, mobile, and fax numbers.
                                      properties:
                                        Phone:
                                          description: The guest's primary phone number.
                                          type: string
                                          example: '12345678'
                                        Mobile:
                                          description: The guest's mobile phone number.
                                          type: string
                                          example: '12345678'
                                        Fax:
                                          description: The guest's fax number.
                                          type: string
                                          example: '12345678'
                                    Type:
                                      description: |
                                        Identifies whether the guest is an adult or a child.
                                        
                                        Can be `10` for Adult, or `8` for Child.
                                        
                                        Valid values only include either `10` or `8`.
                                      type: integer
                                      enum:
                                        - 8
                                        - 10
                                    Email:
                                      description: The guest's email address.
                                      type: string
                                      minLength: 1
                                      example: 'WEBSERVICES.SUPPORT@SABRE.COM'
                                    Age:
                                      description: |
                                        The guest's age.
                                        
                                        This field is mandatory for the guest `Type` of `8` (child).
                                      type: integer
                                      minimum: 1
                                      example: 30
                                    Index:
                                      description: |
                                        The sequential number of the guest within a group of guests.
                                        
                                        If there is only a single guest, this value will always be `1`.
                                      type: integer
                                      minimum: 1
                                      example: 1
                                    LeadGuest:
                                      description: If `true`, this guest is the main guest for the booking.
                                      type: boolean
                                      example: true
                                    FrequentFlyerNumber:
                                      description: The frequent flyer number associated with the lead guest, displayed as a two-letter airline code followed by the frequent flyer number.
                                      type: string
                                      minLength: 1
                                      example: 'LH12345'
                                    LoyaltyId:
                                      description: The unique loyalty program ID associated with the lead guest that should be specified as a two-letter hotel chain code followed by the traveler's loyalty ID.
                                      type: string
                                      minLength: 1
                                      example: 'LY12345'
                                    Title:
                                      description: The title used before the surname of the guest, such as `MR` or `MS`.
                                      type: string
                                      example: 'MR'
                                    FirstName:
                                      description: The first name of the guest.
                                      type: string
                                      example: 'John'
                                    LastName:
                                      description: The last name of the guest.
                                      type: string
                                      example: 'Rambo'
                                    NameNumber:
                                      description: |
                                        Used to associate the GDS legacy booking (`bookGDSviaCSL`=`false`) with a specific name number from the PNR name field.

                                        * The system only accepts Sabre PNR name numbers, such as `1.1`, `2.1`, etc.
                                        * It is not possible to associate a hotel booking to more than one PNR name field.
                                      type: string
                                      example: '1.1'
                                minItems: 1
                                maxItems: 99
                            required:
                              - Guest
                          RoomExtras:
                            type: object
                            description: Contains room extra (additional room amenities) information.
                            properties:
                              RoomExtra:
                                description: Lists all room extras (additional room amenities) associated with a given room.
                                type: array
                                items:
                                  description: Contains individual room extra information.
                                  properties:
                                    Type:
                                      description: The room extra type. Can be `26` for Crib, `91` for Rollaway Bed, or `196` for an Extra Person.
                                      type: integer
                                      minimum: 1
                                      example: 26
                                    Quantity:
                                      description: The number of room extras.
                                      type: integer
                                      minimum: 1
                                      example: 3
                                    Amount:
                                      description: The monetary amount of the room extra.
                                      type: number
                                      example: 10.00
                                  required:
                                    - Quantity
                                minItems: 0
                                maxItems: 99
                          NonSmoking:
                            description: If `true`, the room is non-smoking.
                            type: boolean
                            example: true
                          BedTypeCode:
                            description: |
                              Allows users to request a specific bed type code.

                              Used by EAN (Expedia Affiliate Network) aggregator.
                            type: integer
                            minimum: 1
                            example: 1
                          AccessibilityInformation:
                            description: Allows a customer to request special accessibility rooms.
                            type: integer
                            minimum: 1
                            example: 1
                          RoomIndex:
                            description: |
                              The sequential identifier for this room in a multi-room booking.
                              
                              Use `1` for the first room, `2` for the second room, etc.
                            type: integer
                            minimum: 1
                            example: 1
                        required:
                          - Guests
                          - RoomIndex
                      minItems: 1
                      maxItems: 99
                    NumberOfRooms:
                      description: The total number of rooms to book.
                      type: integer
                      example: 3
                  required:
                    - Room
                SpecialInstructions:
                  type: object
                  description: |
                    Contains text-based special preference instructions for the hotel booking.
                    
                    Note: Currently, only one special instruction is sent to the supplier. Multiple instructions are aggregated into a single message.
                  properties:
                    SpecialInstruction:
                      description: |
                        Lists all special instructions for the room.
                        
                        Note: Multiple instructions are combined and sent as a single message to the supplier.
                      type: array
                      items:
                        description: Specifies a single special instruction.
                        example: 'Flowers are needed.'
                        type: string
                      minItems: 1
                      maxItems: 99
                  required:
                    - SpecialInstruction
                PaymentInformation:
                  type: object
                  description: |
                    Used to pass payment information for the hotel booking.

                    Omit `PaymentInformation` entirely to pay later. In the event the chosen hotel property does not support this, an error will be returned.
                  properties:
                    FormOfPaymentReference:
                      type: object
                      description: |
                        Contains a reference to an existing form of payment in the PNR.
                        
                        When using this object, do not populate fields in `/PaymentInformation/FormOfPayment`.
                      properties:
                        ref:
                          description: The identifier of an existing payment card in the PNR.
                          example: '3'
                          type: string
                        strongCustomerAuthenticationRef:
                          description: The authentication reference within an already existing payment card.
                          example: '1'
                          type: string
                        cardSecurityCode:
                          description: The Card Verification Value (CVV) and Card Security Code (CSC) for the referenced payment card.
                          example: '122'
                          type: string
                      required:
                        - ref
                    FormOfPayment:
                      type: object
                      description: |
                        Contains the form of payment for the hotel booking.

                        Use only one payment type: `PaymentCard`, `VirtualCard`, `Agency`, `Corporate`, or `Company`.
                      properties:
                        PaymentCard:
                          type: object
                          description: Contains payment card details for the hotel booking.
                          properties:
                            PaymentType:
                              description: |
                                Identifies the payment type. Can be:
                                
                                 - `CC` - Credit card

                                 - `CA` - Cash

                                 - `CK` - Check

                                 - `MS` - Miscellaneous

                                 - `GR` - Group
                                
                                 - `SGR` - Sub-group.
                              type: string
                              enum:
                                - CC
                                - CA
                                - CK
                                - MS
                                - GR
                                - SGR
                            CardCode:
                              description: The two-character code of the credit card issuer.
                              type: string
                              example: 'DC'
                            CardNumber:
                              description: |
                                The credit card number without spaces or dashes.
                                
                                Must be a valid 13-19 digit card number.
                              type: string
                              example: '311234567685619'
                            ExpiryMonth:
                              description: The credit card expiration month (1-12).
                              type: integer
                              maximum: 12
                              minimum: 1
                              example: 12
                            ExpiryYear:
                              description: The four-digit credit card expiration year.
                              type: string
                              example: '2019'
                            FullCardHolderName:
                              type: object
                              description: Contains cardholder name details.
                              properties:
                                Title:
                                  description: The cardholder's name and title.
                                  type: string
                                  example: 'MR'
                                FirstName:
                                  description: The cardholder's first name.
                                  type: string
                                  example: 'David Robert'
                                LastName:
                                  description: The cardholder's last name.
                                  type: string
                                  example: 'Johnes'
                                Email:
                                  description: The cardholder's email address.
                                  type: string
                                  example: 'DRJ@SABRE.COM'
                              required:
                                - FirstName
                                - LastName
                            CSC:
                              description: The three-digit code on the back of the payment card.
                              type: string
                              example: '123'
                            Address:
                              type: object
                              description: Contains the cardholder's billing address details.
                              properties:
                                AddressLine:
                                  type: array
                                  items:
                                    type: string
                                    example: 'Krakowska St'
                                    description: A single line of the cardholder's street address.
                                  minItems: 0
                                  maxItems: 9
                                CityName:
                                  description: The cardholder's city name.
                                  type: string
                                  example: 'Krakow'
                                CityCodes:
                                  type: object
                                  description: Contains one or more city codes for the cardholder's address with their source authority.
                                  properties:
                                    Code:
                                      description: Lists the city codes with their context.
                                      type: array
                                      items:
                                        properties:
                                          codeContext:
                                            description: The source authority of the code (typically IATA).
                                            type: string
                                            example: 'IATA'
                                          content:
                                            type: string
                                            example: 'KRK'
                                            description: The cardholder's city code.
                                      minItems: 1
                                  required:
                                    - Code
                                StateProvince:
                                  type: object
                                  description: Contains the cardholder's state or province information.
                                  properties:
                                    code:
                                      description: The cardholder's state or province code.
                                      type: string
                                      example: 'MP'
                                StateProvinceCodes:
                                  type: object
                                  description: Contains multiple state or province codes with their source authorities.
                                  properties:
                                    Code:
                                      type: array
                                      items:
                                        properties:
                                          codeContext:
                                            description: The source authority of the code (typically IATA).
                                            type: string
                                            example: 'IATA'
                                          content:
                                            type: string
                                            example: 'MP'
                                            description: The cardholder's state or province code.
                                      minItems: 1
                                      maxItems: 99
                                  required:
                                    - Code
                                PostCode:
                                  description: The cardholder's postal code.
                                  type: string
                                  example: '30-415'
                                Country:
                                  type: object
                                  description: Contains the cardholder's country information.
                                  properties:
                                    code:
                                      description: The cardholder's country code.
                                      example: 'PL'
                                      type: string
                                CountryCodes:
                                  type: object
                                  description: Contains multiple country codes with their source authorities.
                                  properties:
                                    Code:
                                      type: array
                                      items:
                                        properties:
                                          codeContext:
                                            description: The source authority of the code (typically IATA).
                                            example: 'IATA'
                                            type: string
                                          content:
                                            type: string
                                            example: 'PL'
                                            description: The cardholder's country code.
                                      minItems: 1
                                      maxItems: 99
                                  required:
                                    - Code
                            Phone:
                              type: object
                              description: Contains the cardholder's phone contact details.
                              properties:
                                PhoneUseType:
                                  description: The cardholder's phone use type.
                                  type: string
                                  example: 'H'
                                PhoneCountryCode:
                                  description: The cardholder's phone country code.
                                  type: string
                                  example: 'PL'
                                PhoneNumber:
                                  description: The cardholder's phone number.
                                  type: string
                                  example: '123456789'
                              required:
                                - PhoneNumber
                            StrongCustomerAuthentication:
                              description: Lists strong customer authentication (SCA) data for secure payment verification.
                              type: array
                              items:
                                type: object
                                properties:
                                  Channel:
                                    description: Indicates the channel through which the transaction is initiated. Can be `MO` (Mail Order), `TO` (Telephone Order), `EC` (ECOM), or `FA` (Face to Face).
                                    example: EC
                                    type: string
                                  CardNumberCollection:
                                    description: Determines how the card number is collected for this transaction. Can be `K` (keyed in) or `S` (card on file; previously stored credentials).
                                    example: K
                                    type: string
                                  ExemptionCode:
                                    description: Determines which exemption method is used. Can be `SC` (Secure Corporate Exemption), `DA` (Delegated Authentication), `TR` (Transaction Risk Analysis Exemption), `TB` (Trusted Beneficiary Exemption), or `LV` (Low Value Exemption).
                                    example: SC
                                    type: string
                                  MandateType:
                                    description: |
                                      
                                      The mandate type between the cardholder and the agent/third party. Can be:
                                      
                                        - `NA`, no agreement for future transactions
                                      
                                        - `NS`, agreement for future no-show or cancellation fees
                                      
                                        - `AC`, agreement for any payments due after check-in to cover charges during the stay
                                      
                                        - `CO`, any charges post-checkout
                                      
                                        - `BP`, agreement for pre-payment, deposit, or balance payment
                                      
                                        - `FR`, agreement for a recurring payment with a fixed date and a fixed amount
                                      
                                        - `VR`, agreement for a recurring payment with a fixed date and a variable amount
                                      
                                        - `UR`, agreement for a recurring payment with a non-fixed date and a variable amount.
                                    example: NS
                                    type: string
                                  OriginalPaymentRef:
                                    description: Indicates the authorization request when performed by a booking agent. Can be the Authorization Trace ID or the Authorization Trans ID and may consist of up to 16 alphanumeric and special characters. The value is returned in the initial authorization response.
                                    example: '1234547839012345'
                                    type: string
                                  MerchantName:
                                    description: The full merchant name or the unique identifier of the payee at authorization. Can consist of up to 40 alphanumeric characters.
                                    example: TEST CREDIT CARD
                                    type: string
                                  T3DSAuthValue:
                                    description: |
                                     The 3DS Authentication value beginning with one of the following cryptograms:
 
                                     - `AAV` for Mastercard

                                     - `AEVV` for Amex

                                     - `CAVV` for Visa.

                                     A 20-byte value that has been Base64 encoded, resulting in a 28-byte string.
                                    example: ABC123455533533444455555678
                                    type: string
                                  TAVV:
                                    description: |
                                      The token authentication value.

                                      A 20-byte value that has been Base64 encoded, resulting in a 28-byte string.
                                    example: ABC3434334343556677487312567
                                    type: string
                                  ECI:
                                    description: The Electronic Commerce Indicator consisting of two alphanumeric characters.
                                    example: AB
                                    type: string
                                  DirectoryServerTrxID:
                                    description: The 3DS transaction ID returned by the 3DS Directory Server. A 20-byte, unsigned binary value.
                                    example: ABCDEFGHI123456789012!.1234567890123
                                    type: string
                                  Version:
                                    description: The version of the 3DS Program Protocol. A three-character alphanumeric string without any punctuation marks.
                                    example: '123'
                                    type: string
                                  AuthenticationIssues:
                                    description: |
                                      Indicates an authentication outage during the 3DS flow between merchant-gateway, 3DS Server, and Directory Server connectivity.
                                      
                                      Authentication could not be performed or no response was received.
                                      
                                      This is not a formal exemption but provides information for issuers to consider.
                                    example: AO
                                    type: string
                                  PurchaseAmount:
                                    description: The cost of the purchase.
                                    example: '1234.56'
                                    type: string
                                  PurchaseCurrency:
                                    description: The currency used in the purchase.
                                    example: USD
                                    type: string
                                  VerificationResult:
                                    description: Indicates whether the cardholder is enrolled in 3DS.
                                    example: PASS
                                    type: string
                                  AuthenticationResult:
                                    description: Indicates whether authentication was successful.
                                    example: OK
                                    type: string
                                  LastUpdateTime:
                                    description: Timestamp when the Secure Card Authentication (SCA) was last updated.
                                    example: '2024-08-19T09:35:10'
                                    type: string
                                required:
                                  - Channel
                                  - CardNumberCollection
                                  - ExemptionCode
                                  - MandateType
                                  - OriginalPaymentRef
                                  - MerchantName
                                  - T3DSAuthValue
                                  - TAVV
                                  - ECI
                                  - DirectoryServerTrxID
                                  - Version
                                  - AuthenticationIssues
                                  - PurchaseAmount
                                  - PurchaseCurrency
                                  - VerificationResult
                                  - AuthenticationResult
                                  - LastUpdateTime
                              minItems: 1
                              maxItems: 99
                          required:
                            - PaymentType
                            - CardCode
                            - CardNumber
                            - ExpiryMonth
                            - ExpiryYear
                        VirtualCard:

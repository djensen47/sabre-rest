                            Zip:
                              description: Used to specify the zip code of the card holder.
                              type: string
                              minLength: 1
                              maxLength: 128
                              example: '75001'
                            cardHolderName:
                              description: Used to specify the name of the card holder.
                              type: string
                              minLength: 1
                              maxLength: 128
                              example: 'Homer'
                            streetAddress:
                              description: Used to specify the street address of the card holder.
                              type: string
                              minLength: 1
                              maxLength: 128
                              example: 'Alabama Ave'
                            city:
                              description: Used to specify the city of the card holder.
                              type: string
                              minLength: 1
                              maxLength: 128
                              example: 'Dallas'
                            stateOrProvince:
                              description: |
                                Used to specify the state or province of the card holder.

                                `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                              type: string
                              minLength: 1
                              maxLength: 128
                              example: 'TX'
                          oneOf:
                            - properties:
                                PostalCode:
                                  description: Used to specify the postal code of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: '12345'
                                cardHolderName:
                                  description: Used to specify the name of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Homer'
                                streetAddress:
                                  description: Used to specify the street address of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Alabama Ave'
                                city:
                                  description: Used to specify the city of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Dallas'
                                stateOrProvince:
                                  description: |
                                    Used to specify the state or province of the card holder.

                                    `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                    `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'TX'
                              required:
                                - PostalCode
                              additionalProperties: false
                            - properties:
                                Zip:
                                  description: Used to specify the zip code of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: '75001'
                                cardHolderName:
                                  description: Used to specify the name of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Homer'
                                streetAddress:
                                  description: Used to specify the street address of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Alabama Ave'
                                city:
                                  description: Used to specify the city of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Dallas'
                                stateOrProvince:
                                  description: |
                                    Used to specify the state or province of the card holder.

                                    `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                    `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'TX'
                              required:
                                - Zip
                              additionalProperties: false
                          required:
                            - cardHolderName
                            - streetAddress
                            - city
                        PreferredCustomer:
                          type: object
                          description: |
                            Used to indicate in a client`s Passenger Name Record (PNR) that your client is a preferred customer.
                          properties:
                            ind:
                              description: If `true`, indicates that a client is a preferred customer in the Passenger Name Record (PNR), overriding the automatic address verification (AVS) check at the time of ticketing.
                              type: boolean
                              example: true
                      oneOf:
                        - properties:
                            BillingInformation:
                              type: object
                              description: Used to pass the credit card billing information.
                              properties:
                                PostalCode:
                                  description: Used to specify the postal code of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: '12345'
                                Zip:
                                  description: Used to specify the zip code of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: '75001'
                                cardHolderName:
                                  description: Used to specify the name of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Homer'
                                streetAddress:
                                  description: Used to specify the street address of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Alabama Ave'
                                city:
                                  description: Used to specify the city of the card holder.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'Dallas'
                                stateOrProvince:
                                  description: |
                                    Used to specify the state or province of the card holder.

                                    `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                    `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  example: 'TX'
                              oneOf:
                                - properties:
                                    PostalCode:
                                      description: Used to specify the postal code of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: '12345'
                                    cardHolderName:
                                      description: Used to specify the name of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Homer'
                                    streetAddress:
                                      description: Used to specify the street address of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Alabama Ave'
                                    city:
                                      description: Used to specify the city of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Dallas'
                                    stateOrProvince:
                                      description: |
                                        Used to specify the state or province of the card holder.

                                        `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                        `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'TX'
                                  required:
                                    - PostalCode
                                  additionalProperties: false
                                - properties:
                                    Zip:
                                      description: Used to specify the zip code of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: '75001'
                                    cardHolderName:
                                      description: Used to specify the name of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Homer'
                                    streetAddress:
                                      description: Used to specify the street address of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Alabama Ave'
                                    city:
                                      description: Used to specify the city of the card holder.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'Dallas'
                                    stateOrProvince:
                                      description: |
                                        Used to specify the state or province of the card holder.

                                        `stateOrProvince` with a state code is required for addresses in the United States, U.S. Virgin Islands, and Puerto Rico.

                                        `stateOrProvince` with a province code is required for addresses outside the United States, U.S. Virgin Islands, and Puerto Rico.
                                      type: string
                                      minLength: 1
                                      maxLength: 128
                                      example: 'TX'
                                  required:
                                    - Zip
                                  additionalProperties: false
                          required:
                            - BillingInformation
                          additionalProperties: false
                        - properties:
                            PreferredCustomer:
                              type: object
                              description: |
                                Used to indicate in a client`s Passenger Name Record (PNR) that your client is a preferred customer.
                              properties:
                                ind:
                                  description: If `true`, indicates that a client is a preferred customer in the Passenger Name Record (PNR), overriding the automatic address verification (AVS) check at the time of ticketing.
                                  type: boolean
                                  example: true
                          required:
                            - PreferredCustomer
                          additionalProperties: false
                    CustLoyalty:
                      description: Used to pass the frequent flyer number information.
                      type: array
                      items:
                        properties:
                          MembershipID:
                            description: Used to add a frequent traveler number into the record.
                            type: string
                            example: '1'
                          NameNumber:
                            description: Used to specify a passenger name number.
                            type: string
                            example: '121'
                          ProgramID:
                            description: Used to add the carrier code associated with the frequent traveler number.
                            type: string
                            example: '5'
                          SegmentNumber:
                            description: |
                              Used to add a segment number to associate the frequent traveler number to.

                              SegmentNumber and TravelingCarrierCode cannot combine.
                            type: string
                            example: '14441'
                          TravelingCarrierCode:
                            description: |
                              Used to transmit the frequent traveler number of one airline to accrue mileage on another carrier.

                              SegmentNumber and TravelingCarrierCode cannot combine.
                            type: string
                            example: 'S1'
                        required:
                          - MembershipID
                          - ProgramID
                      minItems: 0
                    CustomerIdentifier:
                      description: |
                        Used to add a customer number (Also known as `DK number`) into the record.

                        Please note that this qualifier is not applicable to Sabre Sonic Res-based clients.

                        The value of can be `6`, `7`, or `10` alphanumeric.
                      type: string
                      example: '1111111'
                    Email:
                      description: Used to pass the e-mail details.
                      type: array
                      items:
                        properties:
                          Address:
                            description: Used to add an email address into the record.
                            type: string
                            example: 'john.doe@example.com'
                          LanguageOverride:
                            description: Used to override the language in the agency`s Travel Journal Record (TJR).
                            type: string
                            example: 'O'
                          NameNumber:
                            description: Used to specify a passenger name number.
                            type: string
                            example: '1.1'
                          ShortText:
                            description: Used to specify the miscellaneous email address-related free text information.
                            type: string
                            example: 'ABC123'
                          Type:
                            description: |
                              Used to specify the type of email address.

                              Acceptable values for `Type` are: `BC` for blind copy, `CC` for carbon copy, `FR` for from, or `To` for to.
                            type: string
                            enum:
                              - BC
                              - CC
                              - FR
                              - TO
                            example: 'BC'
                        required:
                          - Address
                      minItems: 0
                    PersonName:
                      description: Used to add the passenger names.
                      type: array
                      items:
                        properties:
                          GivenName:
                            description: Used to pass the passenger`s first name.
                            type: string
                            example: 'Homer'
                          GroupInfo:
                            type: object
                            description: Used to pass the group information details.
                            properties:
                              VendorPrefs:
                                type: object
                                description: Used to specify if the request is based upon a hosted or a non-hosted carrier.
                                properties:
                                  Airline:
                                    type: object
                                    description: Specify if the request is based upon a hosted or a non-hosted carrier.
                                    properties:
                                      Code:
                                        description: |
                                          Used to specify the airline that the group is travelling with.

                                          Please note that this qualifier is not applicable to Sabre Sonic Res-based subscribers, or Sabre Travel Network-based subscribers.
                                        type: string
                                        example: '15f41'
                                    required:
                                      - Code
                                required:
                                  - Airline
                              Name:
                                description: Used to specify any miscellaneous group booking related free text title information.
                                type: string
                                example: 'Sabre'
                              NumSeatsRemaining:
                                description: Used to specify the number of passengers travelling in a group.
                                type: integer
                                example: 16
                            required:
                              - Name
                              - NumSeatsRemaining
                          Surname:
                            description: Used to pass the passenger`s surname.
                            type: string
                            example: 'Smith'
                          Infant:
                            description: Used to specify that the particular passenger is an infant.
                            type: boolean
                            example: true
                          NameNumber:
                            description: Used to specify a passenger name number, and is only applicable when used in conjunction with `PassengerType`.
                            type: string
                            example: '123ABC'
                          NameReference:
                            description: Used to specify miscellaneous name reference-related information.
                            type: string
                            example: '123ABC'
                          PassengerType:
                            description: |
                              Used to add a passenger type code into the record.

                              Please note that this qualifier is not applicable to Sabre Sonic Res-based clients.
                            type: string
                            example: 'Normal'
                      minItems: 0
            AirBook:
              type: object
              description: Used to add air segments.
              properties:
                RetryRebook:
                  type: object
                  description: Used to specify if re-booking of segments is required when UC segment status is encountered.
                  properties:
                    Option:
                      description: If `true`, specifies whether re-booking of segments is required when a `UC` segment status is encountered in any segment being booked.
                      type: boolean
                      example: true
                    NumAttempts:
                      description: The number of times to repeat the `RetryRebook` process if the first attempt results in a segment status of `UC`.
                      type: integer
                      example: 15
                      minimum: 1
                      maximum: 30
                    WaitInterval:
                      description: The acceptable `WaitInterval` interval range from 0 to 10000 milliseconds.
                      type: integer
                      example: 5000
                      minimum: 0
                      maximum: 10000
                  required:
                    - Option
                HaltOnStatus:
                  description: Used to specify values that cause subsequent pricing, and beyond processing to stop if they appear.
                  type: array
                  items:
                    properties:
                      Code:
                        description: |
                          Used to specify values that cause subsequent pricing, and beyond processing to stop if they appear.

                          In order to successfully price an air itinerary the status code associated with the individual segments cannot be `NN`, `NO`, `UC` or `US`.

                          After successfully booking flights, the system will compare the status codes returned from the carrier against the client-specified codes to determine if subsequent pricing, and beyond processing should occur.
                          
                          Please note that even if you do not specify any status code, the system will automatically validate whether a booked flight segment contains the code `NN`.
                          
                          If found, the system will break the processing.
                          
                          Many low cost airlines (LCCs) use `NN` as their default status code (it will be changed to `HK`/confirmed only after a successful fulfillment), hence it is possible to disable the check.
                          
                          To do so, please send the value `NONE` as the only `Code` to be checked.
                        type: string
                        minLength: 1
                        example: '123ABC452'
                    required:
                      - Code
                  minItems: 0
                OriginDestinationInformation:
                  type: object
                  description: Used to specify the air segments to be booked.
                  properties:
                    FlightSegment:
                      description: Used to specify the air flight segment to be booked.
                      type: array
                      items:
                        properties:
                          DestinationLocation:
                            type: object
                            description: Used to specify the arrival airport code.
                            properties:
                              LocationCode:
                                description: Used to specify the arrival airport code.
                                type: string
                                example: 'DTW'
                            required:
                              - LocationCode
                          Equipment:
                            type: object
                            description: Used to specify the equipment type of the aircraft being booked.
                            properties:
                              AirEquipType:
                                description: Used to specify the equipment type of the aircraft being booked.
                                type: string
                                example: 'standard'
                            required:
                              - AirEquipType
                          MarketingAirline:
                            type: object
                            description: Used to specify the marketing airline code.
                            properties:
                              Code:
                                description: Used to specify the marketing airline code.
                                type: string
                                example: 'L45'
                              FlightNumber:
                                description: |
                                  Used to specify the flight number.

                                  `OPEN` can also be passed if the user desires an open space ticket.
                                type: string
                                example: '63451'
                            required:
                              - Code
                              - FlightNumber
                          MarriageGrp:
                            description: |
                              Information whether the flight segment is part of a married connection.

                              `O` means no. `I` means yes.
                            type: string
                            enum:
                              - O
                              - I
                          OperatingAirline:
                            type: object
                            description: Used to specify the operating airline code.
                            properties:
                              Code:
                                description: Used to describe the code of the carrier operating the flight.

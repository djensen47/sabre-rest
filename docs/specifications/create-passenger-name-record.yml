                          example: 'SABRE TRAVEL'
                          type: string
                        CityName:
                          description: The travel agency's city name.
                          example: 'SOUTHLAKE'
                          type: string
                        CountryCode:
                          description: The two-letter ISO country code for the travel agency's location.
                          example: 'US'
                          type: string
                        PostalCode:
                          description: The travel agency's ZIP or postal code.
                          example: '90210'
                          type: string
                        StateCountyProv:
                          type: object
                          description: The state, county or province details.
                          properties:
                            StateCode:
                              example: 'TX'
                              description: The state code.
                              type: string
                          required:
                            - StateCode
                        StreetNmbr:
                          example: '3150 SABRE DRIVE'
                          description: The street number.

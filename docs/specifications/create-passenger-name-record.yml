                        VehType:
                          description: |
                            The type of vehicle to rent.

                            For a list of values, refer to the [Car APIs: Vehicle Type Codes](https://developer.sabre.com/guides/travel-agency/cars/vehicle-type-codes) matrix.
                          type: string
                          example: 'SCAR'
                      required:
                        - VehType
                  required:
                    - VehPref
                VehRentalCore:
                  type: object
                  description: Contains vehicle booking details.
                  properties:
                    PickUpLocation:
                      type: object
                      description: Contains the vehicle pick up location.
                      properties:
                        ArrivalFlightInfo:
                          type: object
                          description: Contains information regarding a flight arrival.
                          properties:
                            MarketingAirline:
                              type: object
                              description: Contains identification of the arrival flight`s marketing carrier.
                              properties:
                                Code:
                                  description: The marketing carrier code.
                                  type: string
                                  example: 'XX'
                                FlightNumber:
                                  description: The flight number.
                                  type: string
                                  example: '1234'
                              required:
                                - Code
                                - FlightNumber
                          required:
                            - MarketingAirline
                        LocationCode:
                          description: The three-letter IATA airport code associated with the vehicle pick up location.
                          type: string
                          example: 'LON'
                        ExtendedLocationCode:
                          description: |
                            An identifier used when a car supplier has a rental location that is not present at an airport.

                            If the extended location code is used, then it is displayed in 3 alpha, followed by 1 additional alpha and 2 numeric format.

                            The additional 1 alpha value can be:

                            * `N` - North

                            * `S` - South

                            * `E` - East

                            * `W` - West

                            * `R` - Resort

                            * `C` - City

                            * `P` - Port

                            * `X` - Rail

                            Note: when  "ExtendedLocationCode" is specified, "LocationCode" also needs to be specified.
                          type: string
                          example: 'LONC18'
                    ReturnLocation:
                      type: object
                      description: Contains an alternate drop-off location, if applicable.
                      properties:
                        LocationCode:
                          description: |
                            Used to specify an alternate drop-off location code, which can be a three-letter IATA city/airport location (eg. LON) or a 6 alpha-numeric for non-airport locations (eg. LONC18).

                            When specifying a non-airport drop-off location the format is 6 alpha-numeric, constructed as: 3 alpha, followed by 1 additional alpha and 2 numeric format.

                            The additional 1 alpha value can be:

                            * `N` - North

                            * `S` - South

                            * `E` - East

                            * `W` - West

                            * `R` - Resort

                            * `C` - City

                            * `P` - Port

                            * `X` - Rail
                          type: string
                          example: 'DBM'
                      required:
                        - LocationCode
                    InsertAfter:
                      description: Used to specify an existing segment to place the new car.
                        segment after.
                      type: integer
                      example: 0
                    PickUpDate:
                      description: Used to specify the rental pick up date, which follows the format `YYYY-MM-DD`.
                      type: string
                      example: '2024-12-21'
                    PickUpTime:
                      description: Used to specify the rental pick up time, which follows the format `HH:MM`.
                      type: string
                      pattern: '([0-1][0-9]|[2][0-3]):([0-5][0-9])'
                      example: '10:00'
                    Quantity:
                      description: Used to specify the number of vehicles being requested if applicable.
                      type: integer
                      example: 1
                    ReturnDate:
                      description: Used to specify the rental return date, which follows the format `YYYY-MM-DD`.
                      type: string
                      example: '2024-12-24'
                    ReturnTime:
                      description: Used to specify the rental return date, which follows the format `HH:MM`.
                      type: string
                      pattern: '([0-1][0-9]|[2][0-3]):([0-5][0-9])'
                      example: '12:00'
                VendorPrefs:
                  type: object
